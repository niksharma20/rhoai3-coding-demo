apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 010-openshift-ai-platform-foundation
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/instance: openshift-gitops
    demo.rhoai.io/stage: "010"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  project: rhoai-demo
  source:
    # repoURL and targetRevision are set by deploy.sh from .env (GIT_REPO_URL, GIT_REPO_BRANCH)
    repoURL: https://github.com/adnan-drina/rhoai3-coding-demo.git
    targetRevision: main
    path: gitops/stages/010-openshift-ai-platform-foundation/base
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideDiff=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # Stage 010 creates the shared DSC. Later stages enable these component
    # fields with GitOps hook jobs so the base platform can validate cleanly
    # before GPU, model serving, and MaaS stages are deployed.
    - group: datasciencecluster.opendatahub.io
      kind: DataScienceCluster
      name: default-dsc
      jsonPointers:
        - /spec/components/kueue
        - /spec/components/kserve
        - /spec/components/llamastackoperator
        - /spec/components/ogx
        - /spec/components/aipipelines
        - /spec/components/trustyai
        - /spec/components/mlflowoperator
    # The live subscription channel is held at stable-3.5 on this cluster.
    # GitHub main still publishes stable-3.4 until this overlay is pushed, so
    # selfHeal must not move the channel back.
    - group: operators.coreos.com
      kind: Subscription
      name: rhods-operator
      namespace: redhat-ods-operator
      jsonPointers:
        - /spec/channel
