apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 060-model-evaluation
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/instance: openshift-gitops
    demo.rhoai.io/stage: "060"
  annotations:
    argocd.argoproj.io/sync-wave: "60"
    argocd.argoproj.io/manifest-generate-paths: /gitops/stages/060-model-evaluation
spec:
  project: rhoai-demo
  source:
    repoURL: https://github.com/niksharma20/rhoai3-coding-demo.git
    targetRevision: main
    path: gitops/stages/060-model-evaluation/base
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideDiff=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: ""
      kind: Namespace
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
