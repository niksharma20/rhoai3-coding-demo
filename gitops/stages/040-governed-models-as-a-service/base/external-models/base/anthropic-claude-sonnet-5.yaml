apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalProvider
metadata:
  name: claude-sonnet-5
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: claude-sonnet-5
    app.kubernetes.io/component: external-provider
    demo.rhoai.io/provider: anthropic
  annotations:
    argocd.argoproj.io/sync-wave: "16"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider: anthropic
  endpoint: api.anthropic.com
  auth:
    type: apikey
    secretRef:
      name: anthropic-provider-api-key
---
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: claude-sonnet-5
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: claude-sonnet-5
    app.kubernetes.io/component: external-model
    demo.rhoai.io/provider: anthropic
  annotations:
    argocd.argoproj.io/sync-wave: "16"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  externalProviderRefs:
    - ref:
        name: claude-sonnet-5
      targetModel: claude-sonnet-5
      apiFormat: messages
      path: /v1/messages
      weight: 1
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: claude-sonnet-5
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: claude-sonnet-5
    app.kubernetes.io/component: maas-model-ref
    demo.rhoai.io/provider: anthropic
  annotations:
    argocd.argoproj.io/sync-wave: "17"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Models tab title. The model id and endpoint stay metadata.name.
    openshift.io/display-name: Claude Sonnet 5
spec:
  modelRef:
    kind: ExternalModel
    name: claude-sonnet-5
