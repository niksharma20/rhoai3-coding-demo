apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalProvider
metadata:
  name: gpt-4o-mini
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: gpt-4o-mini
    app.kubernetes.io/component: external-provider
    demo.rhoai.io/provider: openai
  annotations:
    argocd.argoproj.io/sync-wave: "16"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider: openai
  endpoint: api.openai.com
  auth:
    type: apikey
    secretRef:
      name: openai-provider-api-key
---
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: gpt-4o-mini
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: gpt-4o-mini
    app.kubernetes.io/component: external-model
    demo.rhoai.io/provider: openai
  annotations:
    argocd.argoproj.io/sync-wave: "16"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  externalProviderRefs:
    - ref:
        name: gpt-4o-mini
      targetModel: gpt-4o-mini
      apiFormat: openai-chat
      path: /v1/chat/completions
      weight: 1
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: gpt-4o-mini
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: gpt-4o-mini
    app.kubernetes.io/component: maas-model-ref
    demo.rhoai.io/provider: openai
  annotations:
    argocd.argoproj.io/sync-wave: "17"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Models tab title. The model id and endpoint stay metadata.name.
    openshift.io/display-name: GPT-4o mini
spec:
  modelRef:
    kind: ExternalModel
    name: gpt-4o-mini
