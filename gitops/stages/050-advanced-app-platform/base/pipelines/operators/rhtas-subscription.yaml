# Red Hat Trusted Artifact Signer: sigstore-based signing and attestation
# (Fulcio, Rekor, CLI server) for AI-generated artifacts.
# The Securesign instance lives in trusted-artifact-signer. Fulcio trusts
# the platform realm; configure-securesign-issuer fills in the live route.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhtas-operator
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  name: rhtas-operator
  channel: stable-v1.4
  installPlanApproval: Automatic
  source: redhat-operators
  sourceNamespace: openshift-marketplace
